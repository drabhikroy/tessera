  <rect x="13" y="3" width="8" height="8" rx="1.5" fill="#8fc1de" opacity="0.75"/>
  <rect x="3" y="13" width="8" height="8" rx="1.5" fill="#8fc1de" opacity="0.75"/>
  <rect x="13" y="13" width="8" height="8" rx="1.5" fill="#8fc1de" opacity="0.5"/>
</svg>

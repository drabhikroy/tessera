# Publishes a release when a version tag is pushed. The notes combine a
# stable overview, highlights, installation, and license from
# RELEASE_TEMPLATE.md with the specific changes for that version from
# NEWS.md, so a newcomer reading the release learns what the app is, and
# a returning user can see what moved. A source archive is attached for
# anyone citing or returning to a specific version.
name: release

on:
  push:
    tags: ["v*"]

# The only write this workflow needs is the release it publishes.
permissions:
  contents: write

# Every action is pinned to a full commit rather than a tag. A tag can be
# moved to different code after the fact, and an action runs with this
# repository's token, so a moved tag is a way into the repository. The
# version comment beside each pin is what Dependabot reads and updates.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # The overview, highlights, installation, and license stay
          # stable across versions, so they live in their own file rather
          # than being reconstructed from a changelog on every tag.
          sed "s/{{VERSION}}/$VERSION/" .github/RELEASE_TEMPLATE.md \
            > /tmp/notes.md

          # What changed in this specific version comes from NEWS.md,
          # appended under its own heading so a returning user can see
          # both what the app is and what moved since they last looked.
          awk -v v="# Tessera $VERSION" '
            $0 == v {found = 1; next}
            found && /^# Tessera / {exit}
            found {print}
          ' NEWS.md > /tmp/changes.md

          # The release page is titled with the app name and the bare
          # version, matching every earlier release, rather than with the
          # tag, which is what the page would otherwise be called.
          echo "title=Tessera $VERSION" >> "$GITHUB_OUTPUT"

          if [ -s /tmp/changes.md ]; then
            {
              echo ""
              echo "### Changes in this version"
              echo ""
              sed '/./,$!d' /tmp/changes.md
            } >> /tmp/notes.md
          fi

      - name: Build the source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/build
          rsync -a --exclude ".git" --exclude ".github" \
                --exclude "node_modules" \
                --exclude "package-lock.json" --exclude "package.json" \
                ./ "/tmp/build/tessera-$VERSION/"
          (cd /tmp/build && zip -rq "tessera-$VERSION.zip" "tessera-$VERSION")
          mv "/tmp/build/tessera-$VERSION.zip" .

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: /tmp/notes.md
          files: tessera-*.zip
          # A draft, so nothing is public until it has been read and
          # published by hand from the releases page.
          draft: true
